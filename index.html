<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una carta del Módulo 7A 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#fffaf0;--bg:#f3e3c3;--ink:#3b2a1a;--mut:#8a7358;--kraft:#d9b98a;--kraft2:#c49f6b;--kraft3:#e6cba2;--red:#d6455d;--pri:#d6455d;--line:#ead9b8;
--c0:#ffe0e6;--b0:#ff8fa3;--c1:#fff0c2;--b1:#f2c14e;--c2:#d6f3df;--b2:#5fd08c;--c3:#d9e9ff;--b3:#6aa8ff;--c4:#ebdfff;--b4:#a77bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background-image:radial-gradient(#e9d3a8 1.2px,transparent 1.2px);background-size:22px 22px}
main{max-width:460px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.hand{font-family:"Caveat","Segoe Script","Bradley Hand",cursive;font-weight:700}
h1{font-size:40px;line-height:1;margin:0 0 6px;text-align:center}
h2{font-size:24px;line-height:1.25;margin:0 0 4px;text-align:center}
.sub{text-align:center;color:var(--mut);font-size:15px;margin:0 0 14px}
/* sobre */
.scene{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:6px}
.env{position:relative;width:290px;height:190px;margin-top:70px;cursor:pointer}
.env .back{position:absolute;inset:0;background:var(--kraft2);border-radius:8px;box-shadow:0 14px 26px rgba(80,50,10,.28)}
.env .letter{position:absolute;left:14px;right:14px;top:12px;height:170px;background:var(--paper);border-radius:6px;z-index:2;transition:transform .7s .35s;padding:14px;font-size:26px;text-align:center;line-height:1.3;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.env .letter i{display:block;height:7px;border-radius:9px;background:var(--line);margin:9px 0}
.env.open .letter{transform:translateY(-95px)}
.env .front{position:absolute;inset:0;z-index:3;background:var(--kraft);border-radius:8px;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);filter:drop-shadow(0 -1px 0 rgba(0,0,0,.08))}
.env .flap{position:absolute;left:0;top:0;width:100%;height:112px;z-index:4;background:var(--kraft3);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s,z-index 0s .3s;border-radius:8px 8px 0 0}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env .seal{position:absolute;left:50%;top:92px;width:54px;height:54px;margin-left:-27px;border-radius:50%;background:var(--red);z-index:5;display:grid;place-items:center;font-size:26px;box-shadow:0 4px 8px rgba(0,0,0,.3);transition:opacity .3s,transform .3s}
.env.open .seal{opacity:0;transform:scale(.4)}
.stamp{position:absolute;right:12px;top:12px;z-index:6;width:46px;height:56px;background:#fff7e0;border:2px dashed var(--red);display:grid;place-items:center;font-size:24px;transform:rotate(6deg)}
.postmark{position:absolute;left:12px;bottom:14px;z-index:6;font-size:11px;font-weight:800;color:#7a5a38;opacity:.7;border:2px solid #7a5a38;border-radius:50%;width:58px;height:58px;display:grid;place-items:center;text-align:center;line-height:1.05;transform:rotate(-12deg)}
.tap{animation:bob 1.4s ease-in-out infinite;font-size:26px}
@keyframes bob{50%{transform:translateY(-7px)}}
.fly{animation:fly 1s .2s ease-in forwards}
@keyframes fly{to{transform:translate(120px,-260px) rotate(14deg) scale(.4);opacity:0}}
/* papel */
.paper{background:var(--paper);border-radius:6px;padding:20px 16px 22px;box-shadow:0 12px 26px rgba(80,50,10,.22);border-top:8px solid var(--red);background-image:linear-gradient(transparent 31px,var(--line) 32px);background-size:100% 32px;animation:up .4s}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.dots{display:flex;justify-content:center;gap:7px;margin-bottom:12px}
.dots b{width:11px;height:11px;border-radius:50%;background:var(--line);transition:background .3s}
.dots b.on{background:var(--red)}
.q{background:var(--paper);margin:-4px -4px 10px;padding:8px 4px;border-radius:8px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:18px;border:3px solid;font:inherit;font-size:16px;font-weight:800;color:var(--ink);cursor:pointer;transition:transform .12s}
.opt:active{transform:scale(.96)}
.opt.sel{transform:scale(1.03) rotate(-1deg);box-shadow:0 0 0 3px var(--red)}
.opt .e{font-size:34px;line-height:1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row .opt{flex-direction:column;text-align:center;gap:6px;padding:14px 8px}
.btn{display:block;width:100%;margin-top:16px;padding:16px;border:0;border-radius:16px;background:var(--red);color:#fff;font:inherit;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #a32f43}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a32f43}
.btn.alt{background:transparent;color:var(--red);border:3px solid var(--red);box-shadow:none}
.big{font-size:70px;text-align:center;margin:8px 0}
.emo{display:flex;justify-content:center;gap:14px;font-size:42px;margin:10px 0 6px}
.st{text-align:center;font-weight:800;margin-top:8px}
.hide{display:none}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ====== CONFIGURACIÓN ====== */
var MAIL = "cartografiamapeando@gmail.com";
var ENDPOINT = "https://formsubmit.co/ajax/" + MAIL;

var Q = [
 {q:"¿Qué tan seguido vienes al Módulo 7A?", o:[["🌅","Casi todos los días"],["📅","Varias veces por semana"],["🗓️","De vez en cuando"],["🐣","Es de las primeras veces"]], grid:1},
 {q:"¿Con quién sueles venir?", o:[["🧍","Solo, a mi aire"],["👯","Con una persona"],["👥","En grupo"],["🎭","Depende del día"]], grid:1},
 {q:"¿Qué sientes justo cuando te acercas a los cubículos?", o:[["🎯","Voy con fe de encontrar uno"],["🎲","Siento que juego a la lotería"],["🙄","Ya voy mentalizado a que estará lleno"],["😬","Voy con nervios, no sé qué me espera"],["😌","Voy tranquilo, casi siempre hay lugar"]]},
 {q:"¿Qué tan fácil o cómodo te resulta saber si un cubículo está ocupado?", o:[["👁️","Tengo que asomarme e interrumpir"],["❓","A veces dudo si hay gente o solo dejaron cosas"],["🚶","Paso de largo si veo movimiento"],["😎","Lo noto fácil a simple vista"]]},
 {q:"Si están todos ocupados y no sabes cuánto tardarán, ¿qué sientes al instante?", o:[["⏳","Frustración por no saber cuánto esperar"],["🔄","Me toca dar vueltas a buscar otro sitio"],["😐","Resignación total"],["🏃","Me voy de una vez"],["🧘","Espero tranquilo, no me afecta"]]},
 {q:"Cuando consigues uno, ¿para qué lo usas y cómo te sientes adentro?", o:[["🎧","Modo concentración total"],["🗣️","Reunión rápida o trabajo en equipo"],["☕","Pausa o descanso personal"],["📚","Estudio en grupo con buena vibra"],["😅","Lo uso con prisa y algo de estrés"]]},
 {q:"Sabiendo que otros pueden estar buscando espacio, ¿cómo te sientes con tu tiempo ahí?", o:[["😇","Sin prisa, me quedo lo que necesito"],["👀","Miro el reloj y me da culpa"],["😰","Siento presión por liberarlo rápido"],["🤷","No lo pienso, uso el tiempo que haga falta"]]},
 {q:"Si el Módulo 7A fuera el clima, ¿cómo estaría hoy?", o:[["☀️","Soleado: todo fluye"],["⛅","Nublado a ratos: depende"],["🌧️","Lluvioso: casi siempre lleno"],["⛈️","Tormenta: puro caos"]], grid:1}
];
var A = [], app = document.getElementById("app");

function html(h){ app.innerHTML = h; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function envelope(open, inner){
  return '<div class="env'+(open?' open':'')+'" id="env"><div class="back"></div><div class="letter">'+(inner||'<i></i><i></i><i></i><i></i>')+'</div><div class="front"></div><div class="flap"></div><div class="seal">💌</div><div class="stamp">🎧</div><div class="postmark">MÓDULO<br>7A</div></div>';
}

/* 1. Sobre cerrado */
function intro(){
  html('<div class="scene"><h1 class="hand">Tienes una carta 💌</h1><p class="sub">Del Módulo 7A, para ti</p>'+envelope(false)+'<div class="tap">👆</div><p class="sub">Toca el sobre para abrirlo</p></div>');
  var env = document.getElementById("env");
  env.onclick = function(){
    env.onclick = null; env.classList.add("open");
    setTimeout(letter, 1300);
  };
}

/* 2. Carta de bienvenida */
function letter(){
  html('<div class="paper"><h1 class="hand">¡Hola! 👋</h1><div class="emo">🎧 🎲 ⏳ ☕</div><p class="sub">Cuéntanos cómo se siente usar los cubículos. Solo tocas emojis: sin escribir, en cerca de 1 minuto.</p><button class="btn" id="go">Empezar ✏️</button></div>');
  document.getElementById("go").onclick = function(){ A = []; ask(0); };
}

/* 3. Preguntas */
function ask(i){
  var d = Q[i], h = '<div class="paper"><div class="dots">';
  for(var n=0;n<Q.length;n++) h += '<b'+(n<=i?' class="on"':'')+'></b>';
  h += '</div><h2 class="hand" style="font-size:28px">'+d.q+'</h2><div class="opts'+(d.grid?' row':'')+'"'+(d.grid?' style="display:grid"':'')+'>';
  d.o.forEach(function(o,k){
    h += '<button class="opt" data-k="'+k+'" style="background:var(--c'+(k%5)+');border-color:var(--b'+(k%5)+')"><span class="e">'+o[0]+'</span><span>'+o[1]+'</span></button>';
  });
  html(h + '</div></div>');
  var bs = app.querySelectorAll(".opt");
  for(var j=0;j<bs.length;j++) bs[j].onclick = function(){
    var k = +this.getAttribute("data-k"); this.classList.add("sel");
    A[i] = d.o[k][0] + " " + d.o[k][1];
    setTimeout(function(){ i+1 < Q.length ? ask(i+1) : send(); }, 280);
  };
}

/* 4. Envío */
function payload(){
  var p = {_subject:"Encuesta Módulo 7A", _template:"table", _captcha:"false"};
  Q.forEach(function(d,i){ p[(i+1)+". "+d.q] = A[i]; });
  return p;
}
function plain(){
  var s = "Resultados de la encuesta del Módulo 7A\n\n";
  Q.forEach(function(d,i){ s += (i+1)+". "+d.q+"\n   → "+A[i]+"\n\n"; });
  return s;
}
function send(){
  html('<div class="scene"><h1 class="hand">Cerrando tu carta…</h1>'+envelope(true,'<div style="font-size:30px;margin-top:30px">✅ 💌 ✅</div>')+'<p class="st" id="st">Enviando ✉️</p></div>');
  var env = document.getElementById("env");
  setTimeout(function(){ env.classList.remove("open"); }, 200);
  var ctrl = new AbortController(), t = setTimeout(function(){ ctrl.abort(); }, 15000);
  fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body:JSON.stringify(payload()), signal:ctrl.signal})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(x){ clearTimeout(t); (x.ok && String(x.j.success) === "true") ? ok(env) : fail(); })
    .catch(function(){ clearTimeout(t); fail(); });
}
function ok(env){
  setTimeout(function(){ env.classList.add("fly"); }, 700);
  setTimeout(function(){
    html('<div class="paper" style="text-align:center"><div class="big">📬</div><h1 class="hand">¡Carta enviada!</h1><p class="sub">Gracias por compartir cómo te sientes en el Módulo 7A 💛</p><div class="emo">🎧 ☕ 🗣️</div></div>');
  }, 1700);
}
function fail(){
  html('<div class="paper" style="text-align:center"><div class="big">📮</div><h2 class="hand" style="font-size:30px">No pudimos enviarla automáticamente</h2><p class="sub">¿Nos ayudas? Toca el botón para mandarla desde tu correo; ya va escrita.</p><button class="btn" id="re">🔁 Intentar de nuevo</button><button class="btn alt" id="ml">📩 Enviar desde mi correo</button><button class="btn alt" id="cp">📋 Copiar mis respuestas</button><p class="sub" id="msg" style="margin-top:12px"></p></div>');
  document.getElementById("re").onclick = send;
  document.getElementById("ml").onclick = function(){
    location.href = "mailto:"+MAIL+"?subject="+encodeURIComponent("Encuesta Módulo 7A")+"&body="+encodeURIComponent(plain());
  };
  document.getElementById("cp").onclick = function(){
    var m = document.getElementById("msg");
    try{ navigator.clipboard.writeText(plain()).then(function(){ m.textContent = "¡Copiado! Pégalo en un correo a "+MAIL; }, function(){ m.textContent = "No se pudo copiar. Haz una captura de pantalla."; }); }
    catch(e){ m.textContent = "No se pudo copiar. Haz una captura de pantalla."; }
  };
}
intro();
</script>
</body>
</html>
